<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>attar-bunam</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #startBtn {
            padding: 16px 32px;
            font-size: 20px;
            cursor: pointer;
        }

        #jumpscare {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: black;
            z-index: 9999;
        }

        #jumpscare img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <button id="startBtn">Klik Aku</button>

    <div id="jumpscare">
        <img src="./bago.jpeg" alt="Jumpscare">
        <audio id="scream" autoplay>
            <source src="./chicken-on-tree-screaming-cut.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        document.getElementById("startBtn").addEventListener("click", () => {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("jumpscare").style.display = "flex";

            const audio = document.getElementById("scream");
            audio.currentTime = 0;
            audio.play().catch(err => console.error(err));
        });
    </script>

</body>
</html>
